{% extends 'base.html' %}{% block content %}<div class="section-heading"><div><span class="eyebrow">TÀI KHOẢN CỦA BẠN</span><h1>Thông báo</h1><p>Cập nhật hoạt động liên quan đến tài khoản của bạn.</p></div>{% if unread_notifications %}<form method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><button>Đánh dấu tất cả đã đọc</button></form>{% endif %}</div><section class="panel notification-history">{% for n in rows %}<form method="post" action="{{ notification_root }}/{{ n.id }}/read"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="notification-item {{ 'unread' if not n.read_at }}"><span>{{ n.message }}</span><time>{{ n.created|vn_date(true) }} · {{ 'Chưa đọc' if not n.read_at else 'Đã đọc' }}</time></button></form>{% else %}<p>Bạn chưa có thông báo.</p>{% endfor %}</section>{% endblock %}
