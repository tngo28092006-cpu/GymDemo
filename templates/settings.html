{% extends 'base.html' %}
{% block content %}
<div class="section-heading">
    <div>
        <h1>Bảng giá</h1>
        <p>Giá mới áp dụng cho hóa đơn lập sau khi lưu.</p>
    </div>
</div>
<div class="pricing-editor">
    {% for p in packages %}
    <section class="panel price-editor-card" aria-labelledby="price-heading-{{ p.id }}">
        <header>
            <span class="card-icon">{{ icon('wallet') }}</span>
            <h2 id="price-heading-{{ p.id }}">Gói {{ p.months }} tháng</h2>
        </header>
        <form method="post">
            <input type="hidden" name="csrf" value="{{ csrf }}">
            <input type="hidden" name="action" value="price">
            <input type="hidden" name="id" value="{{ p.id }}">
            <label for="price-{{ p.id }}">Giá gói (VND)</label>
            <input id="price-{{ p.id }}" type="number" min="1" max="2147483647" name="price" value="{{ p.price }}" required>
            <button type="submit">Lưu giá</button>
        </form>
    </section>
    {% endfor %}
</div>
{% endblock %}
