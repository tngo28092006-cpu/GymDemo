{% extends 'base.html' %}{% block content %}<div class="narrow"><h1>Bắt đầu hành trình tập luyện</h1><p class="muted">Đăng ký hội viên. Tạo tài khoản đăng nhập bằng số điện thoại. Gói tập được kích hoạt khi lễ tân xác nhận thanh toán.</p><form method="post" class="panel"><input type="hidden" name="csrf" value="{{ csrf }}"><label>Họ tên<input name="name" required maxlength="120"></label><div class="grid"><label>Giới tính<select name="gender"><option>Nam</option><option>Nữ</option><option>Khác</option></select></label><label>Năm sinh<input name="birth" type="number" min="1900" max="{{ today[:4] }}" required></label></div><label>Số điện thoại<input name="phone" type="tel" pattern="[0-9]{9,15}" required></label><label>Email nhận xác nhận (không bắt buộc)<input name="email" type="email"></label><div class="grid"><label>Mật khẩu<input name="password" type="password" minlength="8" maxlength="128" required autocomplete="new-password" placeholder="Từ 8 đến 128 ký tự"></label><label>Nhập lại mật khẩu<input name="confirm_password" type="password" minlength="8" maxlength="128" required autocomplete="new-password" placeholder="Xác nhận mật khẩu"></label></div><label>Gói tập<select name="package">{% for p in packages %}<option value="{{ p.id }}">{{ p.months }} tháng — {{ '{:,}'.format(p.price) }} đ</option>{% endfor %}</select></label><p>Ngày đăng ký: {{ (today)|vn_date }}</p><button>Đăng ký hội viên</button></form></div>{% endblock %}
