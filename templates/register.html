{% extends 'base.html' %}{% block content %}<div class="narrow"><h1>Bắt đầu hành trình tập luyện</h1><p class="muted">Đăng ký hội viên. Gói tập được kích hoạt khi thu ngân xác nhận thanh toán.</p><form method="post" class="panel"><input type="hidden" name="csrf" value="{{ csrf }}"><label>Họ tên<input name="name" required maxlength="120"></label><div class="grid"><label>Giới tính<select name="gender"><option>Nam</option><option>Nữ</option><option>Khác</option></select></label><label>Năm sinh<input name="birth" type="number" min="1900" max="{{ today[:4] }}" required></label></div><label>Số điện thoại<input name="phone" type="tel" pattern="[0-9]{9,15}" required></label><label>Email nhận xác nhận<input name="email" type="email" required></label><label>Gói tập<select name="package">{% for p in packages %}<option value="{{ p.id }}">{{ p.months }} tháng — {{ '{:,}'.format(p.price) }} đ</option>{% endfor %}</select></label><p>Ngày đăng ký: {{ today }}</p><button>Đăng ký hội viên</button></form></div>{% endblock %}
