<details class="notification-bell"><summary aria-label="Thông báo, {{ unread_notifications }} chưa đọc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 21h4"/></svg>{% if unread_notifications %}<span class="notification-badge">{{ '99+' if unread_notifications>99 else unread_notifications }}</span>{% endif %}</summary><section class="notification-dropdown" aria-label="Thông báo của bạn"><div class="notification-heading"><strong>Thông báo</strong><span>{{ unread_notifications }} chưa đọc</span></div>{% for n in notifications %}<form method="post" action="{{ notification_root }}/{{ n.id }}/read"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="notification-item {{ 'unread' if not n.read_at }}"><span>{{ n.message }}</span><time>{{ n.created|vn_date(true) }}</time></button></form>{% else %}<p class="notification-empty">Bạn chưa có thông báo.</p>{% endfor %}<form method="post" action="{{ notification_root }}" data-mark-notifications-read><input type="hidden" name="csrf" value="{{ csrf }}"><button type="submit" class="notification-all secondary" style="width:100%;margin:0;border-radius:0">Đọc thông báo</button></form></section></details>
