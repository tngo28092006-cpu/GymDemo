{% extends 'base.html' %}{% block content %}<div class="narrow"><div class="steps-label"><b>1</b><span>Tạo tài khoản</span><i></i><span>2. Chọn gói tập</span></div><h1>Bắt đầu phiên bản<br>khỏe hơn của bạn.</h1><p class="muted">Tạo tài khoản bằng số điện thoại. Bạn có thể chọn gói tập và đăng ký HLV sau khi đăng nhập.</p><form method="post" class="panel"><input type="hidden" name="csrf" value="{{ csrf }}"><label>Họ và tên<input name="name" required maxlength="120" value="{{ request.form.get('name','') }}" autocomplete="name" placeholder="Họ tên của bạn"></label><label>Số điện thoại dùng để đăng nhập<input name="phone" type="tel" autocomplete="tel" required value="{{ request.form.get('phone','') }}" placeholder="Ví dụ: 0901234567"></label><div class="grid"><label>Giới tính<select name="gender">{% for g in ['Nam','Nữ','Khác'] %}<option {% if request.form.get('gender')==g %}selected{% endif %}>{{ g }}</option>{% endfor %}</select></label><label>Năm sinh<input name="birth" type="number" min="1900" max="{{ today[:4] }}" required value="{{ request.form.get('birth','') }}" placeholder="Ví dụ: 2000"></label></div><label>Email <span class="muted">(không bắt buộc, có thể thêm sau)</span><input name="email" type="email" maxlength="254" value="{{ request.form.get('email','') }}" autocomplete="email" placeholder="ban@example.com"></label><div class="grid"><label>Mật khẩu<input name="password" type="password" minlength="8" maxlength="128" required autocomplete="new-password" placeholder="Từ 8 đến 128 ký tự"></label><label>Nhập lại mật khẩu<input name="confirm_password" type="password" minlength="8" maxlength="128" required autocomplete="new-password" placeholder="Xác nhận mật khẩu"></label></div><button>Tạo tài khoản hội viên {{ icon('plus') }}</button><p>Đã có tài khoản? <a href="/login"><strong>Đăng nhập</strong></a></p></form></div>{% endblock %}
