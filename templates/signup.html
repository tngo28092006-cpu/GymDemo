{% extends 'base.html' %}{% block content %}<div class="narrow"><h1>Tạo tài khoản hội viên</h1><p class="muted">Bước 1: tạo tài khoản bằng số điện thoại và mật khẩu. Sau đó đăng nhập để chọn gói tập và theo dõi lịch tập.</p><form method="post" class="panel"><input type="hidden" name="csrf" value="{{ csrf }}"><label>Họ tên<input name="name" required maxlength="120" value="{{ request.form.get('name','') }}" autocomplete="name"></label><label>Email (không bắt buộc, có thể thêm sau)<input name="email" type="email" maxlength="254" value="{{ request.form.get('email','') }}" autocomplete="email"></label><label>Số điện thoại dùng để đăng nhập<input name="phone" type="tel" autocomplete="tel" required value="{{ request.form.get('phone','') }}"></label><div class="grid"><label>Giới tính<select name="gender">{% for g in ['Nam','Nữ','Khác'] %}<option {% if request.form.get('gender')==g %}selected{% endif %}>{{ g }}</option>{% endfor %}</select></label><label>Năm sinh<input name="birth" type="number" min="1900" max="{{ today[:4] }}" required value="{{ request.form.get('birth','') }}"></label></div><label>Mật khẩu (8–128 ký tự)<input name="password" type="password" minlength="8" maxlength="128" required autocomplete="new-password"></label><label>Nhập lại mật khẩu<input name="confirm_password" type="password" minlength="8" maxlength="128" required autocomplete="new-password"></label><button>Tạo tài khoản</button><p>Đã có tài khoản? <a href="/login">Đăng nhập</a></p></form></div>{% endblock %}
