{% extends 'base.html' %}{% block content %}<div class="narrow"><div class="steps-label"><b>01</b><span>KẾT NỐI VỚI KHÔNG GIAN CỦA BẠN</span></div><h1>Chào mừng trở lại.</h1><p class="muted">Đăng nhập để tiếp tục hành trình tập luyện và quản lý phòng tập.</p><form method="post" class="panel"><input type="hidden" name="csrf" value="{{ csrf }}"><label>Số điện thoại / tài khoản nhân viên<input name="username" required autocomplete="username" placeholder="Nhập số điện thoại hoặc tài khoản" value="{{ request.form.get('username','') }}"></label><label>Mật khẩu<input name="password" type="password" required autocomplete="current-password" placeholder="Nhập mật khẩu của bạn"></label><button>Đăng nhập {{ icon('logout') }}</button><p>Chưa có tài khoản? <a href="/signup"><strong>Đăng ký hội viên</strong></a></p></form><div class="signup-note">Hội viên sử dụng số điện thoại đã đăng ký. Nhân viên sử dụng tài khoản được cấp.</div></div>{% endblock %}
